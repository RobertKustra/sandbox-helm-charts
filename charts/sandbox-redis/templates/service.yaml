apiVersion: v1
kind: Service
metadata:
  name: {{ include "sandbox-redis.fullname" . }}
  labels:
    {{- include "sandbox-redis.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "sandbox-redis.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: sandbox-redis
      protocol: TCP
      name: sandbox-redis