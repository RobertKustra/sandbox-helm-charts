{{- if .Values.smokeTest.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "sandbox-vllm.fullname" . }}-smoke-test-r{{ .Release.Revision }}
  labels:
    {{- include "sandbox-vllm.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "sandbox-vllm.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      containers:
        - name: smoke-test
          image: "{{ .Values.smokeTest.image.repository }}:{{ .Values.smokeTest.image.tag }}"
          imagePullPolicy: {{ .Values.smokeTest.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              for i in $(seq 1 {{ .Values.smokeTest.retries }}); do
                if curl -fsS http://{{ include "sandbox-vllm.fullname" . }}:{{ .Values.service.port }}/health > /dev/null; then
                  echo "vLLM health endpoint is ready"
                  exit 0
                fi
                echo "Waiting for vLLM health endpoint... attempt $i/{{ .Values.smokeTest.retries }}"
                sleep {{ .Values.smokeTest.sleepSeconds }}
              done
              echo "Smoke test failed: /health endpoint is not ready"
              exit 1
{{- end }}
