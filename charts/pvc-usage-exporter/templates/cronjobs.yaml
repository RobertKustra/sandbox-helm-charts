{{- $pvcs := list }}
{{- $seenClaimNames := dict }}
{{- range .Values.pvcs }}
  {{- if not (hasKey $seenClaimNames .claimName) }}
    {{- $pvcs = append $pvcs . }}
    {{- $_ := set $seenClaimNames .claimName true }}
  {{- end }}
{{- end }}
{{- $existingPvcs := lookup "v1" "PersistentVolumeClaim" .Release.Namespace "" }}
{{- range $selector := .Values.pvcSelectors }}
  {{- if not $selector.matchLabels }}
    {{- fail "each pvcSelectors entry must define at least one matchLabels value" }}
  {{- end }}
  {{- range $pvc := $existingPvcs.items }}
    {{- $matches := true }}
    {{- $labels := default dict $pvc.metadata.labels }}
    {{- range $key, $value := $selector.matchLabels }}
      {{- if ne (toString (index $labels $key)) (toString $value) }}
        {{- $matches = false }}
      {{- end }}
    {{- end }}
    {{- if and $matches (not (hasKey $seenClaimNames $pvc.metadata.name)) }}
      {{- $pvcs = append $pvcs (dict "name" $pvc.metadata.name "claimName" $pvc.metadata.name) }}
      {{- $_ := set $seenClaimNames $pvc.metadata.name true }}
    {{- end }}
  {{- end }}
{{- end }}
{{- range $pvcs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pvc-usage-{{ .name }}
spec:
  schedule: {{ $.Values.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: pvc-usage-exporter
              image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
              imagePullPolicy: {{ $.Values.image.pullPolicy }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  used_kib=$(du -sk /volume | awk '{print $1}')
                  used_bytes=$((used_kib * 1024))
                  used_gib=$(awk -v kib="$used_kib" 'BEGIN { printf "%.2f", kib / 1048576 }')
                  printf 'PVC usage: namespace=%s pvc=%s used_gib=%s used_bytes=%s\n' "$POD_NAMESPACE" "$PVC_NAME" "$used_gib" "$used_bytes"
                  printf 'pvc_directory_used_bytes %s\n' "$used_bytes" > /tmp/metrics
                  wget -qO- \
                    --header='Content-Type: text/plain; version=0.0.4' \
                    --post-file=/tmp/metrics \
                    "{{ $.Values.pushgatewayUrl }}/metrics/job/pvc-directory-usage/namespace/$POD_NAMESPACE/persistentvolumeclaim/$PVC_NAME"
              env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: PVC_NAME
                  value: {{ .claimName | quote }}
              resources:
                {{- toYaml $.Values.resources | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: volume
                  mountPath: /volume
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: volume
              persistentVolumeClaim:
                claimName: {{ .claimName | quote }}
                readOnly: true
            - name: tmp
              emptyDir: {}
{{- end }}