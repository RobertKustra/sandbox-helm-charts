apiVersion: v1
kind: Service
metadata:
  name: {{ include "sandbox-nginx.fullname" . }}
  labels:
    {{- include "sandbox-nginx.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "sandbox-nginx.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
