apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sandbox-ai-consumer .fullname" . }}
  labels:
    {{- include "sandbox-ai-consumer .labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "sandbox-ai-consumer .name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "sandbox-ai-consumer .name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: sandbox-ai-consumer 
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- range $key, $value := .Values.env.config }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
