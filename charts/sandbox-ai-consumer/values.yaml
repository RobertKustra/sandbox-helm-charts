replicaCount: 1

image:
  repository: ghcr.io/robertkustra/dev/sandbox-ai-consumer
  tag: "0.2.0"
  pullPolicy: IfNotPresent
  pullSecrets: []

service:
  enabled: false
  type: ClusterIP
  port: 80

env:
  config:
    VLLM_BASE_URL: http://sandbox-vllm.llm.svc.cluster.local:8000
    VLLM_MODEL: Qwen/Qwen2.5-Coder-1.5B-Instruct
    VLLM_STRESS: "false"
    VLLM_COUNT: "50"
    VLLM_PARALLEL: "8"
    VLLM_REPEAT_MINUTES: "5"
  secret:
    name: sandbox-ai-consumer-env
    promptKey: VLLM_PROMPT
